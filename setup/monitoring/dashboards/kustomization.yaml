apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: llm-d-monitoring

generatorOptions:
  disableNameSuffixHash: true
  labels:
    grafana_dashboard: "1"
  annotations:
    grafana_folder: llm-d

configMapGenerator:
  - name: llm-d-diagnostic-drilldown-dashboard
    files:
      - json/llm-d-diagnostic-drilldown-dashboard.json
  - name: llm-d-epp-routing-dashboard
    files:
      - json/llm-d-epp-routing.json
  - name: llm-d-failure-saturation-dashboard
    files:
      - json/llm-d-failure-saturation-dashboard.json
  - name: llm-d-inference-gateway
    files:
      - json/llm-d-inference-gateway.json
  - name: llm-d-pd-coordinator-metrics
    files:
      - json/llm-d-pd-coordinator-metrics.json
  - name: llm-d-performance-kv-cache
    files:
      - json/llm-d-performance-kv-cache.json
  - name: llm-d-vllm-overview
    files:
      - json/llm-d-vllm-overview.json
