apiVersion: v1
kind: Service
metadata:
  name: monitoring-otel-collector
spec:
  selector:
    app.kubernetes.io/name: monitoring-otel-collector
  ports:
    - name: otlp-grpc
      port: 4317
      targetPort: otlp-grpc
    - name: otlp-http
      port: 4318
      targetPort: otlp-http
    - name: health
      port: 13133
      targetPort: health
