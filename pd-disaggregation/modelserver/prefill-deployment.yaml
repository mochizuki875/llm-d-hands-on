apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm-sim-prefill
  labels:
    llm-d.ai/role: prefill
spec:
  replicas: 1
  selector:
    matchLabels:
      llm-d.ai/role: prefill
  template:
    metadata:
      labels:
        llm-d.ai/role: prefill
    spec:
      initContainers:
        - name: vllm-render
          image: vllm/vllm-openai-cpu:v0.21.0
          imagePullPolicy: IfNotPresent
          restartPolicy: Always
          command: ["vllm"]
          args:
            - "launch"
            - "render"
            - "Qwen/Qwen2.5-0.5B-Instruct"
            - "--port=8082"
          ports:
            - containerPort: 8082
              name: render
              protocol: TCP
          startupProbe:
            httpGet:
              path: /health
              port: render
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /health
              port: render
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2
          livenessProbe:
            httpGet:
              path: /health
              port: render
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 2
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 1Gi
      containers:
        - name: modelserver
          image: ghcr.io/llm-d/llm-d-inference-sim:v0.10.2
          imagePullPolicy: IfNotPresent
          env:
            - name: PYTHONHASHSEED
              value: "42"
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
          args:
            - "--v=4"
            - "--port=8000"
            - "--model=Qwen/Qwen2.5-0.5B-Instruct"
            - "--served-model-name=Qwen/Qwen2.5-0.5B-Instruct"
            - "--data-parallel-size=1"
            - "--max-num-seqs=8"
            - "--render-url=http://localhost:8082"
            - "--mode=random"
            - "--latency-calculator=per-token"
            - "--enable-kvcache=true"
            - "--enable-prefix-caching=true"
            - "--use-vllm-map-event-format=true"
            - "--kv-cache-size=2048"
            - "--block-size=16"
            - "--hash-seed=42"
            - "--event-batch-size=32"
            - "--prefill-overhead=40ms"
            - "--prefill-time-per-token=30ms"
            - "--prefill-time-std-dev=2ms"
            - "--kv-cache-transfer-time-per-token=12us"
            - "--kv-cache-transfer-time-std-dev=500us"
            - "--time-factor-under-load=2.0"
            - "--startup-duration=3s"
          ports:
            - containerPort: 8000
              name: modelserver
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /health/ready
              port: modelserver
            initialDelaySeconds: 2
            periodSeconds: 3
          livenessProbe:
            httpGet:
              path: /health
              port: modelserver
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi