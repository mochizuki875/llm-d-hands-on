# Gateway provider selection.
# This section configures the gateway implementation only; it is not a generic infrastructure provider setting.
# Options: ["gke", "istio", "none"]
provider:
  name: none

httpRoute:
  # HTTPRoute生成
  create: true
  # HTTPRouteが参照するGatewayを指定
  inferenceGatewayName: llm-d-inference-gateway
  # 0sはproviderの既定上限に委ねる
  requestTimeout: "0s"

router:
  monitoring:
    prometheus:
      auth:
        enabled: false

  epp:
    replicas: 1
    flags:
      v: 4
    pluginsConfigFile: optimized-baseline-plugins.yaml
    pluginsCustomConfig:
      optimized-baseline-plugins.yaml: |
        apiVersion: llm-d.ai/v1alpha1
        kind: EndpointPickerConfig
        # Plugins run with their built-in defaults: the prefix-cache-affinity-filter's
        # peakPrefillThroughput default (15928) is calibrated for this guide's reference
        # setup (Qwen3-32B on H100 80 GB, TP=2). For other hardware/models, measure your
        # own value with guides/recipes/router/calibration and set it on the filter.
        plugins:
        - type: approx-prefix-cache-producer
        - type: inflight-load-producer
        - type: prefix-cache-affinity-filter
        - type: token-load-scorer
        schedulingProfiles:
        - name: default
          plugins:
          - pluginRef: prefix-cache-affinity-filter
          - pluginRef: token-load-scorer
    resources:
      requests:
        cpu: 500m
        memory: 512Mi
      limits:
        cpu: "2"
        memory: 2Gi

  inferencePool:
    # backendで異常があってもpool全体を即座に fail-closedにしない
    failureMode: FailOpen

  modelServers:
    # EPPがbackend通信するprotocolを指定
    protocol: http
    matchLabels:
      # このラベルを持つPodをInferencePoolのbackendとして扱う
      llm-d.ai/guide: optimized-baseline

  tracing:
    sampling:
      sampler: parentbased_traceidratio
      samplerArg: "1.0"
    enabled: true
    otelExporterEndpoint: http://monitoring-otel-collector.llm-d-monitoring.svc.cluster.local:4317